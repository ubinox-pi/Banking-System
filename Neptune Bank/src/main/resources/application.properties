spring.application.name=Neptune Bank
spring.profiles.active=${PROFILE:dev}
# Server configuration
server.port=${PORT:8080}
server.address=${HOST:localhost}
server.error.include-message=never
server.error.include-binding-errors=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Gateway configuration
# auth-service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH-SERVICE:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
# user-service
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=${USER-SERVICE:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**
# account-service
spring.cloud.gateway.routes[2].id=account-service
spring.cloud.gateway.routes[2].uri=${ACCOUNT-SERVICE:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/accounts/**
# messaging-service
spring.cloud.gateway.routes[3].id=messaging-service
spring.cloud.gateway.routes[3].uri=${MESSAGING-SERVICE:http://localhost:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/messages/**
# banking service
spring.cloud.gateway.routes[4].id=banking-service
spring.cloud.gateway.routes[4].uri=${BANKING-SERVICE:http://localhost:8085}
spring.cloud.gateway.routes[4].predicates[0]=Path=/banking/**
# employee service
spring.cloud.gateway.routes[5].id=employee-service
spring.cloud.gateway.routes[5].uri=${EMPLOYEE-SERVICE:http://localhost:8086}
spring.cloud.gateway.routes[5].predicates[0]=Path=/employees/**
# transaction service
spring.cloud.gateway.routes[6].id=transaction-service
spring.cloud.gateway.routes[6].uri=${TRANSACTION-SERVICE:http://localhost:8087}
spring.cloud.gateway.routes[6].predicates[0]=Path=/transactions/**
# card service
spring.cloud.gateway.routes[7].id=card-service
spring.cloud.gateway.routes[7].uri=${EMPLOYEE-SERVICE:http://localhost:8088}
spring.cloud.gateway.routes[7].predicates[0]=Path=/cards/**
# loan service
spring.cloud.gateway.routes[8].id=loan-service
spring.cloud.gateway.routes[8].uri=${LOAN-SERVICE:http://localhost:8089}
spring.cloud.gateway.routes[8].predicates[0]=Path=/loans/**
# Custom properties
auth-service.url=${AUTH_SERVICE:http://localhost:8081}
# cors configuration
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=${ORIGIN:http://192.168.56.1:5173,http://localhost:5173,http://192.168.37.130:5173,http://localhost:4200,http://127.0.0.1:8080,http://localhost:8080}
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
# EUREKA CLIENT CONFIG
eureka.instance.hostname=${HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_TIME_INTERVAL:300}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_EXPIRATION_INTERVAL:900}
eureka.client.registry-fetch-interval-seconds=${EUREKA_FETCH_INTERVAL:600}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# SPRING BOOT ADMIN CLIENT CONFIG
# Use service name in Admin dashboard
spring.boot.admin.client.instance.name=${spring.application.name}
spring.boot.admin.client.instance.service-base-url=${SERVICE_BASE_URL:http://localhost:${server.port}}
spring.boot.admin.client.url=${ADMIN_SERVER_URL:http://localhost:8761/}
spring.boot.admin.client.instance.metadata.show-sensitive=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
spring.boot.admin.client.instance.metadata.user.name=${USER:user}
spring.boot.admin.client.instance.metadata.user.password=${PASSWORD:password}
# security configuration
spring.main.allow-bean-definition-overriding=true
# logging configuration
logging.level.org.springframework.web=${LOGGING_LEVEL:DEBUG}
logging.level.org.springframework.security=${LOGGING_LEVEL:DEBUG}
logging.level.org.springframework.cloud.gateway=${LOGGING_LEVEL:DEBUG}
# Additional logging settings: root level, framework and SQL tracing, file/console patterns and access log
logging.level.root=${ROOT_LOGGING_LEVEL:INFO}
logging.level.org.springframework.boot.actuate=${LOGGING_LEVEL:DEBUG}
logging.level.reactor.netty.http.server=${LOGGING_LEVEL:DEBUG}
logging.level.org.springframework.web.reactive=${LOGGING_LEVEL:DEBUG}
# Hibernate SQL and bind parameter logging (useful for debugging DB queries)
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOGGING:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BIND_LOGGING:TRACE}
# Log file destination (Spring Boot 2+): set via LOG_FILE or LOG_FILE_PATH env vars
logging.file.name=${LOG_FILE:logs/neptune-bank.log}
logging.file.path=${LOG_FILE_PATH:./logs}
# Enable embedded Tomcat access logs
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t \"%r\" %s %b %D
server.tomcat.accesslog.directory=${ACCESS_LOG_DIR:./logs}
server.tomcat.accesslog.prefix=access-log
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.rotate=true
# custom properties
app.secret-key=${SECRET_KEY:ashish}
