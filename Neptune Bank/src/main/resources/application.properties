spring.application.name=Neptune Bank
spring.security.user.name=${USER:user}
spring.security.user.password=${PASSWORD:password}
spring.profiles.active=PROD
# Server configuration
server.port=8080
# Gateway configuration
# auth-service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH-SERVICE:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
# user-service
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=${USER-SERVICE:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**
# account-service
spring.cloud.gateway.routes[2].id=account-service
spring.cloud.gateway.routes[2].uri=${USER-SERVICE:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/accounts/**
# messaging-service
spring.cloud.gateway.routes[3].id=messaging-service
spring.cloud.gateway.routes[3].uri=${MESSAGING-SERVICE:http://localhost:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/messages/**
# banking service
spring.cloud.gateway.routes[4].id=banking-service
spring.cloud.gateway.routes[4].uri=${BANKING-SERVICE:http://localhost:8085}
spring.cloud.gateway.routes[4].predicates[0]=Path=/banking/**
# employee service
spring.cloud.gateway.routes[5].id=employee-service
spring.cloud.gateway.routes[5].uri=${EMPLOYEE-SERVICE:http://localhost:8086}
spring.cloud.gateway.routes[5].predicates[0]=Path=/employees/**
# Custom properties
auth-service.url=${WEBCLIENT_URL:http://localhost:8081}
# cors configuration
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=${ORIGIN:http://192.168.56.1:5173,http://localhost:5173,http://192.168.37.130:5173,http://localhost:4200,http://127.0.0.1:8080,http://localhost:8080}
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
# EUREKA CLIENT CONFIG
eureka.instance.hostname=${HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_TIME_INTERVAL:300}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_EXPIRATION_INTERVAL:900}
eureka.client.registry-fetch-interval-seconds=${EUREKA_FETCH_INTERVAL:600}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# SPRING BOOT ADMIN CLIENT CONFIG
# Use service name in Admin dashboard
spring.boot.admin.client.instance.name=${spring.application.name}
spring.boot.admin.client.instance.service-base-url=${SERVICE_BASE_URL:http://localhost:${server.port}}
spring.boot.admin.client.url=${ADMIN_SERVER_URL:http://localhost:8761/}
spring.boot.admin.client.instance.metadata.show-sensitive=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
spring.boot.admin.client.instance.metadata.user.name=${USER:user}
spring.boot.admin.client.instance.metadata.user.password=${PASSWORD:password}
# security configuration
spring.main.allow-bean-definition-overriding=true
# logging configuration
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
# custom properties
app.secret-key=${SECRET_KEY:ashish}
