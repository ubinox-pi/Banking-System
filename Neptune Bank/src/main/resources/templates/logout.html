<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Logged Out - Neptune Bank</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #b3e0ff 0%, #e6f7ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .logout-container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            padding: 2.5rem 2rem 2rem 2rem;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logout-container h2 {
            color: #0077b6;
            margin-bottom: 1rem;
        }

        .logout-container p {
            color: #333;
            margin-bottom: 2rem;
            text-align: center;
        }

        .logout-container a {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(90deg, #48c6ef 0%, #6f86d6 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            transition: background 0.2s;
        }

        .logout-container a:hover {
            background: linear-gradient(90deg, #6f86d6 0%, #48c6ef 100%);
        }
    </style>
</head>
<body>
<div class="logout-container">
    <h2>You have been logged out</h2>
    <p>Thank you for using Neptune Bank.<br>We hope to see you again soon!</p>
    <a href="/web/auth/login">Back to Login</a>
</div>
</body>
</html>
