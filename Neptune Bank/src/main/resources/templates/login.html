<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Login - Neptune Bank</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #b3e0ff 0%, #e6f7ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .login-container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            padding: 2.5rem 2rem 2rem 2rem;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-container h2 {
            margin-bottom: 1.5rem;
            color: #0077b6;
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #b3e0ff;
            border-radius: 8px;
            font-size: 1rem;
            background: #f6fbff;
            transition: border 0.2s;
        }

        .login-container input:focus {
            border-color: #0077b6;
            outline: none;
        }

        .login-container button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(90deg, #48c6ef 0%, #6f86d6 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-container button:hover {
            background: linear-gradient(90deg, #6f86d6 0%, #48c6ef 100%);
        }

        .login-container .links {
            margin-top: 1rem;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        .login-container .links a {
            color: #0077b6;
            text-decoration: none;
            transition: text-decoration 0.2s;
        }

        .login-container .links a:hover {
            text-decoration: underline;
        }

        .login-container .error {
            color: #e63946;
            margin-bottom: 1rem;
            font-size: 0.98rem;
            display: none;
        }
    </style>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            if (!username || !password) {
                errorDiv.textContent = 'Please enter both username and password.';
                errorDiv.style.display = 'block';
                return;
            }
            errorDiv.style.display = 'none';
            // Simulate login (replace with real logic)
            
        }
    </script>
</head>
<body>
<form class="login-container" onsubmit="handleLogin(event)">
    <h2>Admin Login</h2>
    <div class="error" id="error"></div>
    <label for="username"></label><input autocomplete="username" id="username" placeholder="Username" type="text">
    <label for="password"></label><input autocomplete="current-password" id="password" placeholder="Password"
                                         type="password">
    <button type="submit">Sign In</button>
</form>
</body>
</html>
