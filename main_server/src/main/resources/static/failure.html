<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Login Failed - Neptune Bank</title>
    <style>
        :root {
            --bg: #0a0f1c;
            --card: #121a2b;
            --text: #e6edf3;
            --muted: #9fb3c8;
            --accent: #2dd4bf;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            background: radial-gradient(1000px 600px at 80% -10%, #132036 0%, var(--bg) 60%), var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 560px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 28px;
            backdrop-filter: blur(6px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .header {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: var(--danger);
            font-size: 22px;
            flex: 0 0 44px;
        }

        h1 {
            font-size: 22px;
            line-height: 1.2;
            margin: 0;
        }

        .sub {
            color: var(--muted);
            font-size: 14px;
            margin-top: 6px;
        }

        .tips {
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px dashed rgba(255, 255, 255, 0.12);
            color: var(--muted);
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 22px;
            flex-wrap: wrap;
        }

        .btn {
            appearance: none;
            border: 0;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: transform .06s ease, box-shadow .2s ease, background .2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: .2px;
        }

        .btn.primary {
            color: #07151a;
            background: linear-gradient(180deg, #2be7ce, #17c4ae);
            box-shadow: 0 8px 20px rgba(23, 196, 174, .28);
        }

        .btn.secondary {
            color: var(--text);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        a.btn {
            text-decoration: none;
        }

        .small {
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px;
        }
    </style>
</head>
<body>
<main aria-labelledby="title" class="card" role="main">
    <div class="header">
        <div aria-hidden="true" class="badge">!</div>
        <div>
            <h1 id="title">Login failed</h1>
            <p class="sub">We couldn't sign you in. Double‑check your credentials and try again.</p>
        </div>
    </div>

    <div class="tips">
        <ul style="margin: 0 0 0 18px; padding: 0;">
            <li>Make sure Caps Lock isn't on</li>
            <li>Use your registered email/username</li>
            <li>If you forgot your password, reset it from the login page</li>
        </ul>
    </div>

    <div class="actions">
        <a class="btn primary" href="/login">Try again</a>
        <a class="btn secondary" href="/">Go to home</a>
    </div>
    <div class="small">If this keeps happening, contact support.</div>
</main>
</body>
</html>
