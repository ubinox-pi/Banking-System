spring.application.name=user-service
# Default profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
# Server configuration
server.port=${PORT:8082}
server.error.include-message=never
server.error.include-binding-errors=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
# Database configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/Users}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:ashish}
spring.jpa.hibernate.ddl-auto=${DATABASE_DDL:validate}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=NeptuneHikariCP
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
# mongoDB configuration
spring.data.mongodb.uri=mongodb://localhost:27017/Users
# Logging configuration
logging.level.org.springframework=${LOGGING:DEBUG}
logging.level.org.springframework.security=${LOGGING:DEBUG}
logging.level.org.springframework.kafka.listener.KafkaMessageListenerContainer=${LOGGING:INFO}
# Security configuration
spring.security.user.name=${SECURITY_USERNAME:users}
spring.security.user.password=${SECURITY_PASSWORD:password}
spring.security.user.roles=USER
# Kafka configuration
# Kafka bootstrap servers
spring.kafka.bootstrap-servers=${KAFKA_SERVER:http://localhost:9092}
# Security
spring.kafka.properties.security.protocol=${SASL_SSL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${SCRAM_SHA_512:PLAINTEXT}
spring.kafka.properties.sasl.jaas.config=${REDPANDA_CONFIG:PLAINTEXT};
# Consumer config
spring.kafka.consumer.group-id=${KAFKA_GROUP:user}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.consumer.max-poll-records=50
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Producer config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.batch-size=32768
spring.kafka.producer.buffer-memory=67108864
spring.kafka.producer.compression-type=snappy
# multipart configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,env,loggers
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
#custom properties
app.secret-key=${SECRET_KEY:ashish}
