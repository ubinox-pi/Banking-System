spring.application.name=neptune-hub
spring.datasource.url=jdbc:postgresql://localhost:5433/hubDB
spring.datasource.username=neptune
spring.datasource.password=ankit
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
server.port=8085
logging.level.org.springframework.security=DEBUG
spring.security.user.name=admin
spring.security.user.password=admin
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.transaction=DEBUG
logging.level.org.hibernate=DEBUG
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# === EUREKA SERVER ===
# Since Neptune Hub is the registry itself:
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
# tune timeouts as needed
eureka.server.evictionIntervalTimerInMs=60000
# === GATEWAY ===
# Use discovery locator so gateway routes to registered services automatically
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
# If using any static routes add them here as fallback.
# === JWT validation (no .pem) ===
# The auth-service must expose JWKS at this URL:
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://auth-service:8086/.well-known/jwks.json
# === Spring Boot Admin ===
spring.boot.admin.ui.title=Neptune Hub Admin
spring.boot.admin.client.enabled=true
spring.boot.admin.client.url=http://localhost:8080
# === Actuator exposure (Admin needs these) ===
management.endpoints.web.exposure.include=health,info,metrics,env,logfile,loggers,threaddump
management.endpoint.health.show-details=always
# === Optional: gateway timeouts, rewrite rules, etc. ===
spring.cloud.gateway.default-filters[0]=StripPrefix=1

